
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="light" />
<title>EMIR job tracking tool</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root {
  color-scheme: light;
  --primary: #0b5ed7;
  --bg: #f4f6f9;
  --card: #ffffff;
  --text: #1f2937;
  --muted: #6b7280;
  --border: #e5e7eb;
}

* {
  box-sizing: border-box;
  font-family: Segoe UI, Arial, sans-serif;
}

html {
  color-scheme: light;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
}

/* HEADER */

.header {
  background: #ffffff;
  border-bottom: 1px solid var(--border);
  padding: 12px 18px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.header img {
  height: 34px;
  max-width: 50%;
  object-fit: contain;
}

.header .title {
  font-weight: 600;
  font-size: 14px;
  text-align: right;
}

/* LAYOUT */

.container {
  max-width: 520px;
  margin: 30px auto;
  padding: 0 16px;
}

.screen {
  display: none;
}

.active {
  display: block;
}

.card {
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, .04);
}

label {
  display: block;
  font-size: 13px;
  color: var(--muted);
  margin-top: 14px;
  margin-bottom: 6px;
}

input,
select {
  width: 100%;
  padding: 12px;
  font-size: 15px;
  color: #1f2937;
  background: #ffffff;
  border: 1px solid var(--border);
  border-radius: 8px;
}

button {
  width: 100%;
  padding: 12px;
  border-radius: 8px;
  border: none;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  margin-top: 10px;
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.primary {
  background: #e83d30;
  color: #ffffff;
}

.secondary {
  background: #f3f4f6;
  color: #1f2937;
  border: 1px solid var(--border);
}

/* PRE-FILLED LINK MESSAGE */

.prefill-notice {
  display: none;
  background: #eef6ff;
  border: 1px solid #bfdbfe;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 14px;
  font-size: 13px;
  line-height: 1.5;
}

.prefill-notice strong {
  display: block;
  margin-bottom: 4px;
}

/* BARCODE */

.barcode-wrap {
  background: #ffffff !important;
  color: #000000 !important;
  color-scheme: light;
  forced-color-adjust: none;
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 18px;
  margin-top: 16px;
  text-align: center;
}

.barcode-title {
  font-size: 13px;
  color: var(--muted);
}

.barcode-value {
  font-size: 20px;
  font-weight: 600;
  margin: 6px 0 10px;
  overflow-wrap: anywhere;
  color: #000000 !important;
}

.barcode-wrap svg {
  width: 100%;
  background: #ffffff !important;
  color-scheme: light;
  forced-color-adjust: none;
}

.barcode-wrap svg rect,
.barcode-wrap svg path {
  fill: #000000 !important;
}

.nav {
  display: flex;
  gap: 10px;
}

.nav button {
  flex: 1;
  background: #f3f4f6;
  color: #1f2937;
  border: 1px solid var(--border);
}

/* SCANNER */

#scanner {
  display: none;
  position: fixed;
  inset: 0;
  background: #ffffff;
  z-index: 9999;
  padding: 12px;
  overflow: auto;
}

#reader {
  width: 100%;
  max-height: 45vh;
  overflow: hidden;
  border-radius: 10px;
}

#scanValue {
  font-size: 20px;
  font-weight: 600;
  margin: 16px 0;
  overflow-wrap: anywhere;
}
</style>
</head>

<body>

<!-- HEADER -->

<div class="header">
  <img
    src="https://hayley247.co.uk/wp-content/uploads/2024/03/hayley_247.svg"
    alt="Company logo"
  />
  <div class="title">EMIR job tracking tool</div>
</div>

<div class="container">

  <!-- SETUP SCREEN -->

  <div id="setupScreen" class="screen">

    <div class="card">

      <div id="prefillNotice" class="prefill-notice">
        <strong>Job details loaded</strong>
        Details have been filled in from Machine Shop
        Task Manager. Please check them before
        generating barcodes.
      </div>

      <label for="username">Username</label>
      <input
        id="username"
        placeholder="Enter username"
        autocomplete="username"
      />

      <label for="jobNumber">Job Number</label>
      <input
        id="jobNumber"
        placeholder="e.g. 123456/A"
      />

      <button
        type="button"
        class="secondary"
        onclick="startScan()"
      >
        Scan Job Number
      </button>

      <label for="taskSelect">Task</label>
      <select id="taskSelect"></select>

      <button
        type="button"
        class="primary"
        onclick="generateSequence()"
      >
        Generate Barcodes
      </button>

    </div>

  </div>

  <!-- BARCODE SCREEN -->

  <div id="barcodeScreen" class="screen">

    <div class="card">

      <div
        class="barcode-title"
        id="barcodeTitle"
      ></div>

      <div
        class="barcode-value"
        id="barcodeText"
      ></div>

      <div class="barcode-wrap">
        <svg id="barcode"></svg>
      </div>

      <div class="nav">
        <button
          type="button"
          onclick="prevBarcode()"
        >
          ◀ Previous
        </button>

        <button
          type="button"
          onclick="nextBarcode()"
        >
          Next ▶
        </button>
      </div>

      <button
        type="button"
        class="secondary"
        onclick="backToMenu()"
      >
        New Job
      </button>

    </div>

  </div>

</div>

<!-- CAMERA SCANNER -->

<div id="scanner">

  <div id="reader"></div>

  <div class="card">

    <div style="font-size:12px;color:#6b7280;">
      Live Scan
    </div>

    <div id="scanValue">
      Waiting for scan...
    </div>

    <button
      id="acceptBtn"
      type="button"
      class="primary"
      onclick="acceptScan()"
      disabled
    >
      Accept Scan
    </button>

    <button
      type="button"
      class="secondary"
      onclick="rescanScan()"
    >
      Scan Again
    </button>

    <button
      type="button"
      class="secondary"
      onclick="stopScan()"
    >
      Cancel
    </button>

  </div>

</div>

<script>
"use strict";

/* TASK DEFINITIONS */

const tasks = [
  { name: "Admin",         code: "AD",    needsJob: false },
  { name: "Breakdown",     code: "BDOWN", needsJob: false },
  { name: "CAD",           code: "CAD",   needsJob: true  },
  { name: "Driving",       code: "DR",    needsJob: false },
  { name: "END",           code: "END",   needsJob: false },
  { name: "Housekeeping",  code: "HK",    needsJob: false },
  { name: "Inspection",    code: "INSP",  needsJob: true  },
  { name: "Milling",       code: "MILL",  needsJob: true  },
  { name: "Plant Repair",  code: "PL",    needsJob: false },
  { name: "Slotting",      code: "SLOT",  needsJob: true  },
  { name: "Team Leading",  code: "TL",    needsJob: false },
  { name: "Training",      code: "TR",    needsJob: false },
  { name: "Turning",       code: "TURN",  needsJob: true  },
  { name: "Waiting Time",  code: "WT",    needsJob: false }
];

const taskSelect = document.getElementById("taskSelect");

tasks.forEach(task => {
  const option = document.createElement("option");
  option.value = task.name;
  option.textContent = task.name;
  taskSelect.appendChild(option);
});

let barcodeSequence = [];
let currentIndex = 0;

/* SCREEN CONTROL */

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(screen => {
    screen.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");
}

/* QR LINK PRE-FILL SUPPORT */

function loadPrefilledDetails() {
  const params = new URLSearchParams(window.location.search);

  const usernameParam =
    params.get("username") ?? params.get("employee");

  const jobParam =
    params.get("job") ?? params.get("jobNumber");

  const taskParam = params.get("task");

  const usernameInput =
    document.getElementById("username");

  const jobInput =
    document.getElementById("jobNumber");

  usernameInput.value =
    usernameParam !== null
      ? usernameParam.trim().toUpperCase()
      : (localStorage.getItem("lastUsername") || "");

  jobInput.value =
    jobParam !== null
      ? jobParam.trim().toUpperCase()
      : (localStorage.getItem("lastJob") || "");

  let validTaskProvided = false;

  if (taskParam !== null) {
    const requestedTask = taskParam.trim().toUpperCase();

    const matchedTask = tasks.find(task =>
      task.name.toUpperCase() === requestedTask ||
      task.code.toUpperCase() === requestedTask
    );

    if (matchedTask) {
      taskSelect.value = matchedTask.name;
      validTaskProvided = true;
    }
  }

  const hasPrefilledDetails =
    usernameParam !== null ||
    jobParam !== null ||
    validTaskProvided;

  document.getElementById("prefillNotice").style.display =
    hasPrefilledDetails ? "block" : "none";

  showScreen("setupScreen");
}

window.addEventListener(
  "DOMContentLoaded",
  loadPrefilledDetails
);

/* GENERATE EMIR BARCODE SEQUENCE */

function generateSequence() {
  const task = tasks.find(
    task => task.name === taskSelect.value
  );

  const jobNumber = document
    .getElementById("jobNumber")
    .value
    .trim()
    .toUpperCase();

  const username = document
    .getElementById("username")
    .value
    .trim()
    .toUpperCase();

  if (!task) {
    alert("Select task");
    return;
  }

  if (!username) {
    alert("Enter username");
    return;
  }

  const code39Pattern = /^[A-Z0-9 .\-$/+%]+$/;

  if (!code39Pattern.test(username)) {
    alert(
      "Username contains characters not supported by CODE39 barcodes"
    );
    return;
  }

  if (task.needsJob && !jobNumber) {
    alert("Enter job number");
    return;
  }

  if (task.needsJob && !code39Pattern.test(jobNumber)) {
    alert(
      "Job number contains characters not supported by CODE39 barcodes"
    );
    return;
  }

  localStorage.setItem("lastUsername", username);
  localStorage.setItem("lastJob", jobNumber);

  barcodeSequence = [
    {
      title: "Employee",
      value: username
    }
  ];

  if (task.needsJob) {
    barcodeSequence.push({
      title: "Job Number",
      value: jobNumber
    });
  }

  barcodeSequence.push({
    title: "Task",
    value: task.code
  });

  currentIndex = 0;

  showScreen("barcodeScreen");
  showBarcode();
}

/* DISPLAY BARCODE */

function showBarcode() {
  const item = barcodeSequence[currentIndex];

  if (!item) {
    return;
  }

  document.getElementById("barcodeTitle").innerText =
    item.title;

  document.getElementById("barcodeText").innerText =
    item.value;

  document.getElementById("barcode").innerHTML = "";

  try {
    JsBarcode("#barcode", item.value, {
      format: "CODE39",
      displayValue: false,

      /* Original barcode dimensions */
      height: 90,
      width: 2,
      margin: 10,

      /* High-contrast colours */
      lineColor: "#000000",
      background: "#ffffff"
    });

    /*
      Explicitly preserve barcode colours,
      including on phones using dark mode.
    */
    const barcodeSvg = document.getElementById("barcode");

    barcodeSvg.style.backgroundColor = "#ffffff";
    barcodeSvg.style.colorScheme = "light";
    barcodeSvg.style.forcedColorAdjust = "none";

  } catch (error) {
    console.error("Barcode generation failed:", error);

    alert(
      "Could not generate barcode. Please check the details."
    );

    showScreen("setupScreen");
  }
}

/* BARCODE NAVIGATION */

function nextBarcode() {
  if (currentIndex < barcodeSequence.length - 1) {
    currentIndex++;
    showBarcode();
  }
}

function prevBarcode() {
  if (currentIndex > 0) {
    currentIndex--;
    showBarcode();
  }
}

function backToMenu() {
  showScreen("setupScreen");
}

/* CAMERA SCANNER */

let html5QrCode = null;
let lastScanValue = "";
let sameCount = 0;
let confirmedScan = "";
let scanSession = 0;
let scannerStarting = false;

function resetScanResult() {
  lastScanValue = "";
  sameCount = 0;
  confirmedScan = "";

  document.getElementById("scanValue").innerText =
    "Waiting for scan...";

  document.getElementById("acceptBtn").disabled = true;
}

async function cleanupScanner(scanner) {
  if (!scanner) {
    return;
  }

  try {
    if (
      scanner.getState &&
      scanner.getState() === Html5QrcodeScannerState.SCANNING
    ) {
      await scanner.stop();
    }
  } catch (error) {
    console.warn("Could not stop scanner:", error);
  }

  try {
    scanner.clear();
  } catch (error) {
    console.warn("Could not clear scanner:", error);
  }
}

async function startScan() {
  if (
    scannerStarting ||
    document.getElementById("scanner").style.display === "block"
  ) {
    return;
  }

  const session = ++scanSession;

  scannerStarting = true;

  document.getElementById("scanner").style.display =
    "block";

  resetScanResult();

  let scanner = null;

  try {
    scanner = new Html5Qrcode("reader");
    html5QrCode = scanner;

    const devices = await Html5Qrcode.getCameras();

    if (session !== scanSession) {
      return;
    }

    if (!devices || !devices.length) {
      throw new Error("No camera available");
    }

    const backCam = devices.find(device => {
      const label = (device.label || "").toLowerCase();

      return (
        label.includes("back") ||
        label.includes("rear") ||
        label.includes("environment")
      );
    });

    const cameraId = (backCam || devices[0]).id;

    await scanner.start(
      cameraId,
      {
        fps: 10,
        qrbox: {
          width: 240,
          height: 360
        }
      },
      decodedText => {
        if (session !== scanSession) {
          return;
        }

        document.getElementById("scanValue").innerText =
          decodedText;

        if (decodedText === lastScanValue) {
          sameCount++;
        } else {
          lastScanValue = decodedText;
          sameCount = 1;
        }

        if (sameCount >= 3) {
          confirmedScan = decodedText;

          document.getElementById("acceptBtn").disabled =
            false;
        }
      }
    );

  } catch (error) {
    if (session === scanSession) {
      console.error("Scanner failed to start:", error);

      document.getElementById("scanValue").innerText =
        "Camera unavailable. You can cancel and enter the job number manually.";
    }
  } finally {
    scannerStarting = false;

    if (session !== scanSession) {
      await cleanupScanner(scanner);
    }
  }
}

function acceptScan() {
  if (!confirmedScan) {
    return;
  }

  document.getElementById("jobNumber").value =
    confirmedScan;

  stopScan();
}

function rescanScan() {
  resetScanResult();
}

function stopScan() {
  ++scanSession;

  document.getElementById("scanner").style.display =
    "none";

  const scanner = html5QrCode;

  html5QrCode = null;

  if (!scannerStarting) {
    void cleanupScanner(scanner);
  }
}
</script>

</body>
</html>
