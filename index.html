<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EMIR job tracking tool</title>

<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/html5-qrcode"></script>

<style>
:root{
  --primary:#0b5ed7;
  --bg:#f4f6f9;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --border:#e5e7eb;
}

*{box-sizing:border-box;font-family:Segoe UI, Arial, sans-serif;}

body{margin:0;background:var(--bg);color:var(--text);}

/* HEADER */
.header{
  background:#fff;
  border-bottom:1px solid var(--border);
  padding:12px 18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.header img{height:34px;}
.header .title{font-weight:600;font-size:14px;}

/* LAYOUT */
.container{max-width:520px;margin:30px auto;padding:0 16px;}

.screen{display:none;}
.active{display:block;}

.card{
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:20px;
  box-shadow:0 2px 6px rgba(0,0,0,.04);
}

label{display:block;font-size:13px;color:var(--muted);margin-top:14px;margin-bottom:6px;}

input,select{
  width:100%;
  padding:12px;
  font-size:15px;
  border:1px solid var(--border);
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  margin-top:10px;
}

.primary{background:#e83d30;color:#fff;}
.secondary{background:#f3f4f6;border:1px solid var(--border);}

/* BARCODE */
.barcode-wrap{
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  padding:18px;
  margin-top:16px;
  text-align:center;
}
.barcode-title{font-size:13px;color:var(--muted);}
.barcode-value{font-size:20px;font-weight:600;margin:6px 0 10px;}
svg{width:100%;}

.nav{display:flex;gap:10px;}
.nav button{flex:1;background:#f3f4f6;border:1px solid var(--border);}

/* SCANNER */
#scanner{
  display:none;
  position:fixed;
  inset:0;
  background:#fff;
  z-index:9999;
  padding:12px;
  overflow:auto;
}

#reader{
  width:100%;
  max-height:45vh;
  overflow:hidden;
  border-radius:10px;
}

#scanValue{
  font-size:20px;
  font-weight:600;
  margin:16px 0;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
  <img src="https://hayley247.co.uk/wp-content/uploads/2024/03/hayley_247.svg">
  <div class="title">EMIR job tracking tool</div>
</div>

<div class="container">

<!-- SETUP -->
<div id="setupScreen" class="screen">

  <div class="card">

    <label for="username">Username</label>
    <input id="username" placeholder="Enter username" autocomplete="username">

    <label>Job Number</label>
    <input id="jobNumber" placeholder="e.g. 123456/A">

    <button type="button" class="secondary" onclick="startScan()">
      Scan Job Number
    </button>

    <label>Task</label>
    <select id="taskSelect"></select>

    <button class="primary" onclick="generateSequence()">
      Generate Barcodes
    </button>

  </div>

</div>

<!-- BARCODE -->
<div id="barcodeScreen" class="screen">

  <div class="card">

    <div class="barcode-title" id="barcodeTitle"></div>
    <div class="barcode-value" id="barcodeText"></div>

    <div class="barcode-wrap">
      <svg id="barcode"></svg>
    </div>

    <div class="nav">
      <button onclick="prevBarcode()">◀ Previous</button>
      <button onclick="nextBarcode()">Next ▶</button>
    </div>

    <button class="secondary" onclick="backToMenu()">New Job</button>

  </div>

</div>

</div>

<!-- SCANNER -->
<div id="scanner">
  <div id="reader"></div>

  <div class="card">
    <div style="font-size:12px;color:#6b7280;">Live Scan</div>
    <div id="scanValue">Waiting for scan...</div>

    <button id="acceptBtn" class="primary" onclick="acceptScan()" disabled>Accept Scan</button>
    <button class="secondary" onclick="rescanScan()">Scan Again</button>
    <button class="secondary" onclick="stopScan()">Cancel</button>
  </div>
</div>

<script>

/* TASKS */
const tasks=[
{name:"Admin",code:"AD",needsJob:false},
{name:"Breakdown",code:"BDOWN",needsJob:false},
{name:"CAD",code:"CAD",needsJob:true},
{name:"Driving",code:"DR",needsJob:false},
{name:"END",code:"END",needsJob:false},
{name:"Housekeeping",code:"HK",needsJob:false},
{name:"Inspection",code:"INSP",needsJob:true},
{name:"Milling",code:"MILL",needsJob:true},
{name:"Plant Repair",code:"PL",needsJob:false},
{name:"Slotting",code:"SLOT",needsJob:true},
{name:"Team Leading",code:"TL",needsJob:false},
{name:"Training",code:"TR",needsJob:false},
{name:"Turning",code:"TURN",needsJob:true},
{name:"Waiting Time",code:"WT",needsJob:false}
];

const taskSelect=document.getElementById("taskSelect");

tasks.forEach(t=>{
  const o=document.createElement("option");
  o.value=t.name;
  o.textContent=t.name;
  taskSelect.appendChild(o);
});

let barcodeSequence=[];
let currentIndex=0;

/* SCREEN CONTROL */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

/* INIT */
window.onload=function(){
  document.getElementById("username").value=localStorage.getItem("lastUsername")||"";
  document.getElementById("jobNumber").value=localStorage.getItem("lastJob")||"";
  showScreen("setupScreen");
};

/* BARCODE */
function generateSequence(){
  const task=tasks.find(t=>t.name===taskSelect.value);
  const jobNumber=document.getElementById("jobNumber").value.trim();
  const username=document.getElementById("username").value.trim().toUpperCase();

  if(!task) return alert("Select task");
  if(!username) return alert("Enter username");
  if(!/^[A-Z0-9 .\-$/+%]+$/.test(username)) return alert("Username contains characters not supported by CODE39 barcodes");
  if(task.needsJob && !jobNumber) return alert("Enter job number");

  localStorage.setItem("lastUsername",username);
  localStorage.setItem("lastJob",jobNumber);
  barcodeSequence=[{title:"Employee",value:username}];

  if(task.needsJob){
    barcodeSequence.push({title:"Job Number",value:jobNumber.toUpperCase()});
  }

  barcodeSequence.push({title:"Task",value:task.code});

  currentIndex=0;
  showScreen("barcodeScreen");
  showBarcode();
}

function showBarcode(){
  const item=barcodeSequence[currentIndex];

  document.getElementById("barcodeTitle").innerText=item.title;
  document.getElementById("barcodeText").innerText=item.value;

  document.getElementById("barcode").innerHTML="";

  JsBarcode("#barcode",item.value,{
    format:"CODE39",
    displayValue:false,
    height:90,
    width:2,
    margin:10
  });
}

function nextBarcode(){
  if(currentIndex<barcodeSequence.length-1){
    currentIndex++;
    showBarcode();
  }
}

function prevBarcode(){
  if(currentIndex>0){
    currentIndex--;
    showBarcode();
  }
}

function backToMenu(){
  showScreen("setupScreen");
}

/* SCANNER */
let html5QrCode = null;
let lastScanValue = "";
let sameCount = 0;
let confirmedScan = "";
let scanSession = 0;
let scannerStarting = false;

function resetScanResult(){
  lastScanValue = "";
  sameCount = 0;
  confirmedScan = "";
  document.getElementById("scanValue").innerText = "Waiting for scan...";
  document.getElementById("acceptBtn").disabled = true;
}

async function cleanupScanner(scanner){
  if(!scanner) return;
  try {
    // stop() rejects when the camera was never successfully started.
    if(scanner.getState && scanner.getState() === Html5QrcodeScannerState.SCANNING){
      await scanner.stop();
    }
  } catch(err){
    console.warn("Could not stop scanner:", err);
  }
  try { scanner.clear(); } catch(err) { console.warn("Could not clear scanner:", err); }
}

async function startScan(){
  // Avoid overlapping camera initialization requests.
  if(scannerStarting || document.getElementById("scanner").style.display === "block") return;
  const session = ++scanSession;
  scannerStarting = true;
  document.getElementById("scanner").style.display = "block";
  resetScanResult();

  let scanner = null;
  try {
    scanner = new Html5Qrcode("reader");
    html5QrCode = scanner;
    const devices = await Html5Qrcode.getCameras();
    if(session !== scanSession) return;
    if(!devices || !devices.length) throw new Error("No camera available");

    const backCam = devices.find(d => {
      const label = (d.label || "").toLowerCase();
      return label.includes("back") || label.includes("rear") || label.includes("environment");
    });
    const cameraId = (backCam || devices[0]).id;

    await scanner.start(cameraId, {fps:10, qrbox:{width:240,height:360}}, decodedText => {
      if(session !== scanSession) return;
      document.getElementById("scanValue").innerText = decodedText;
      if(decodedText === lastScanValue){
        sameCount++;
      } else {
        lastScanValue = decodedText;
        sameCount = 1;
      }
      if(sameCount >= 3){
        confirmedScan = decodedText;
        document.getElementById("acceptBtn").disabled = false;
      }
    });
  } catch(err){
    if(session === scanSession){
      console.error("Scanner failed to start:", err);
      document.getElementById("scanValue").innerText = "Camera unavailable. You can cancel and enter the job number manually.";
    }
  } finally {
    scannerStarting = false;
    // If Cancel was pressed during camera startup, release the camera now.
    if(session !== scanSession){
      await cleanupScanner(scanner);
    }
  }
}

function acceptScan(){
  if(!confirmedScan) return;
  document.getElementById("jobNumber").value = confirmedScan;
  stopScan();
}

function rescanScan(){
  resetScanResult();
}

function stopScan(){
  // Hide immediately, even if permission is pending or no barcode was read.
  ++scanSession;
  document.getElementById("scanner").style.display = "none";
  const scanner = html5QrCode;
  html5QrCode = null;
  // If startup is pending, startScan() will clean it up in its finally block.
  if(!scannerStarting) void cleanupScanner(scanner);
}

</script>

</body>
</html>
